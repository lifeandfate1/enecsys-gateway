name: "Enecsys Gateway Listener"
version: "1.0.0"
slug: "enecsys_gateway"
description: "Emulates the Enecsys Cloud Server to decode solar data locally."
url: "https://github.com/lifeandfate1/enecsys-gateway"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
map:
  - "config:rw"
ports:
  5040/tcp: 5040
options:
  mqtt_host: "core-mosquitto"
schema:
  mqtt_host: str
image: "python:3.9-slim"